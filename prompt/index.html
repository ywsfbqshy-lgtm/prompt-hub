<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 Prompt Hub | مكتبة الأوامر — الرئيسية</title>
  <meta name="description" content="منصة تعليمية اجتماعية لمشاركة واكتشاف أفضل أوامر الذكاء الاصطناعي">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation Header -->
  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <div class="brand-icon">🚀</div>
      <span>Prompt Hub</span>
    </a>

    <div class="nav-links">
      <a href="studio.html" class="btn btn-primary btn-sm">
        ➕ شارك أمر جديد
      </a>
      <button class="btn btn-secondary btn-sm" id="theme-toggle-btn" onclick="toggleTheme()">
        🌙 داكن
      </button>
    </div>
  </header>

  <!-- Main Feed Area -->
  <main class="container">
    <!-- Search Bar -->
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="main-search-input" class="search-input" placeholder="ابحث عن Prompt، كود Python، تسويق، أو اسم الناشر...">
    </div>

    <!-- Category Chips Bar -->
    <div class="categories-bar">
      <button class="category-chip active" data-cat="all">🌟 الكل</button>
      <button class="category-chip" data-cat="Education">📚 التعليم والطلاب</button>
      <button class="category-chip" data-cat="Programming">💻 البرمجة</button>
      <button class="category-chip" data-cat="Marketing">📈 التسويق والأعمال</button>
      <button class="category-chip" data-cat="Design">🎨 التصميم والذكاء</button>
      <button class="category-chip" data-cat="Research">🔬 البحوث والتحليل</button>
    </div>

    <!-- Dynamic Prompts Feed Container -->
    <div id="feed-container"></div>
  </main>

  <!-- Frontend JavaScript -->
  <script src="js/app.js"></script>
</body>
</html>
